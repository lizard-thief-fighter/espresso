# Single source of truth for the pack's identity and target versions.
# Bump `version` per the project's versioning rules; release tags must be `v<version>`.

[pack]
name = "Espresso!"
version = "0.0.14"
summary = "Expands on Minecraft's open-ended design, with more reasons to pursue every path."

[versions]
minecraft = "1.21.1"
neoforge = "21.1.265"

[build]
# Folders that make up the pack content (checked to exist by tools/check_pack.py).
overrides = ["config", "moonlight-global-datapacks", "resourcepacks", "options.txt"]
